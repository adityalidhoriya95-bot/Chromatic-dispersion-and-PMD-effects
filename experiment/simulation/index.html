
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Optical Fiber Lab</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <header>
    <h1>VR Optical Fiber Laboratory</h1>
    <p>Chromatic Dispersion and Polarization Mode Dispersion</p>
  </header>

  <main class="layout">
    <aside class="panel">
      <h2>Experiment Controls</h2>

      <label for="length">
        Fiber Length: <span id="lengthValue">50 km</span>
      </label>
      <input id="length" type="range" min="10" max="100"
             step="5" value="50">

      <label for="rate">
        Data Rate: <span id="rateValue">100 Gb/s</span>
      </label>
      <input id="rate" type="range" min="10" max="200"
             step="10" value="100">

      <h3>Simulation</h3>
      <button id="pauseBtn">Pause Pulse</button>
      <button id="resetBtn" class="secondary">Reset</button>

      <h3>Camera Controls</h3>
      <button id="zoomIn">Zoom In +</button>
      <button id="zoomOut">Zoom Out −</button>
      <button id="rotateLeft" class="secondary">Rotate Left</button>
      <button id="rotateRight" class="secondary">Rotate Right</button>

      <h3>Results</h3>
      <button id="resultsBtn">Calculate Results</button>
      <button id="vrBtn">Enter VR Mode</button>

      <div id="results" class="results">
        Loading simulation results...
      </div>

      <p class="help">
        Drag the mouse to look around. Use WASD to move.
        VR requires a compatible headset and browser.
      </p>
    </aside>

    <section class="viewer">
      <a-scene
        id="labScene"
        embedded
        background="color: #061222"
        vr-mode-ui="enabled: true"
        renderer="antialias: true">

        <a-entity light="type: ambient; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; intensity: 2"
                  position="-3 6 4"></a-entity>

        <a-plane position="0 -0.5 -5"
                 rotation="-90 0 0"
                 width="16" height="12"
                 color="#142b43"></a-plane>

        <!-- Optical fiber -->
        <a-cylinder id="fiber"
                    position="0 1 -5"
                    rotation="0 0 90"
                    height="6" radius="0.13"
                    color="#32cfff"
                    material="transparent: true; opacity: 0.5">
        </a-cylinder>

        <a-cylinder position="0 1 -5"
                    rotation="0 0 90"
                    height="6" radius="0.045"
                    color="#ffffff"
                    material="emissive: #00cfff; emissiveIntensity: 2">
        </a-cylinder>

        <!-- Laser and receiver -->
        <a-box position="-3.8 1 -5"
               width="0.7" height="0.8" depth="0.8"
               color="#176bff"></a-box>

        <a-box position="3.8 1 -5"
               width="0.7" height="0.8" depth="0.8"
               color="#16b886"></a-box>

        <!-- Animated optical pulse -->
        <a-sphere id="pulse" position="-3 1 -5"
                  radius="0.18" color="#ffffff"
                  material="emissive: #00cfff; emissiveIntensity: 2">
        </a-sphere>

        <!-- Second pulse represents a different polarization mode -->
        <a-sphere id="pmdPulse" position="-3 1.25 -5"
                  radius="0.12" color="#ffb84d"
                  material="emissive: #ff8800; emissiveIntensity: 2">
        </a-sphere>

        <a-text value="LASER SOURCE" position="-4.1 2 -5"
                align="center" color="#ffffff" width="4"></a-text>

        <a-text value="OPTICAL FIBER" position="0 1.65 -5"
                align="center" color="#70eaff" width="4"></a-text>

        <a-text value="RECEIVER" position="4.1 2 -5"
                align="center" color="#ffffff" width="4"></a-text>

        <a-text value="VR OPTICAL LAB" position="0 3 -5"
                align="center" color="#45d9ff" width="6"></a-text>

        <a-sky color="#061222"></a-sky>

        <a-entity id="cameraRig">
          <a-camera id="camera"
                    position="0 2 4"
                    look-controls
                    wasd-controls
                    camera="fov: 60">
          </a-camera>
        </a-entity>

      </a-scene>
    </section>
  </main>

  <script src="js/vr-lab.js"></script>
</body>
</html>
